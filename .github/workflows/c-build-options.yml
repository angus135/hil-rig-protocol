name: c-build-options

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library-only
            build_type: Debug
            cmake_args: >-
              -DHIL_RIG_PROTOCOL_BUILD_TESTS=OFF
              -DHIL_RIG_PROTOCOL_BUILD_PYTHON=OFF
              -DHIL_RIG_PROTOCOL_BUILD_EXAMPLES=OFF
              -DHIL_RIG_PROTOCOL_TRANSPORT_PROFILE=MVP
              -DHIL_RIG_PROTOCOL_ENABLE_WARNINGS=ON
              -DHIL_RIG_PROTOCOL_WARNINGS_AS_ERRORS=ON
            build_target: hil_rig_protocol
            run_tests: false

          - name: examples
            build_type: Debug
            cmake_args: >-
              -DHIL_RIG_PROTOCOL_BUILD_TESTS=OFF
              -DHIL_RIG_PROTOCOL_BUILD_EXAMPLES=ON
              -DHIL_RIG_PROTOCOL_TRANSPORT_PROFILE=MVP
              -DHIL_RIG_PROTOCOL_ENABLE_WARNINGS=ON
              -DHIL_RIG_PROTOCOL_WARNINGS_AS_ERRORS=ON
            build_target: all
            run_tests: false

          - name: sanitizers
            build_type: Debug
            cmake_args: >-
              -DHIL_RIG_PROTOCOL_BUILD_TESTS=ON
              -DHIL_RIG_PROTOCOL_BUILD_EXAMPLES=OFF
              -DHIL_RIG_PROTOCOL_TRANSPORT_PROFILE=MVP
              -DHIL_RIG_PROTOCOL_ENABLE_WARNINGS=ON
              -DHIL_RIG_PROTOCOL_WARNINGS_AS_ERRORS=ON
              -DHIL_RIG_PROTOCOL_ENABLE_SANITIZERS=ON
            build_target: all
            run_tests: true

          - name: coverage
            build_type: Debug
            cmake_args: >-
              -DHIL_RIG_PROTOCOL_BUILD_TESTS=ON
              -DHIL_RIG_PROTOCOL_BUILD_EXAMPLES=OFF
              -DHIL_RIG_PROTOCOL_TRANSPORT_PROFILE=MVP
              -DHIL_RIG_PROTOCOL_ENABLE_WARNINGS=ON
              -DHIL_RIG_PROTOCOL_WARNINGS_AS_ERRORS=OFF
              -DHIL_RIG_PROTOCOL_ENABLE_COVERAGE=ON
            build_target: all
            run_tests: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcovr

      - name: Configure CMake (${{ matrix.name }})
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            ${{ matrix.cmake_args }}

      - name: Build (${{ matrix.name }})
        run: |
          cmake --build build --target ${{ matrix.build_target }} --verbose

      - name: Run tests (${{ matrix.name }})
        if: ${{ matrix.run_tests }}
        run: |
          ctest --test-dir build --output-on-failure

      - name: Reset coverage counters
        if: ${{ matrix.name == 'coverage' }}
        run: |
          find build -name '*.gcda' -delete

      - name: Run integration tests for coverage
        if: ${{ matrix.name == 'coverage' }}
        run: |
          ctest --test-dir build --output-on-failure -L integration

      - name: Produce integration coverage reports
        if: ${{ matrix.name == 'coverage' }}
        run: |
          mkdir -p build/coverage
          gcovr --root . --filter 'src/' --xml-pretty \
            --output build/coverage/coverage.xml build
          gcovr --root . --filter 'src/' --html-details \
            --output build/coverage/coverage.html build
          gcovr --root . --filter 'src/' --txt \
            --output build/coverage/coverage.txt --print-summary build
          cat build/coverage/coverage.txt

      - name: Upload integration coverage report
        if: ${{ matrix.name == 'coverage' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html
            build/coverage/coverage.*.html
            build/coverage/coverage.txt
          if-no-files-found: error
